<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TAMS, Time Approval Management System." />
    <title>Session Expired | TAMS</title>
    <link rel="stylesheet" href="../static/css/session_expired/styles.css" />
    <script defer src="../static/css/js/event_handlers.js"></script>
    <script defer src="../static/css/js/event_registration.js"></script>
  </head>

  <body class="TAMS-app page-session-expired" data-page="session_expired">
    <div class="TAMS-layout TAMS-layout--auth">
      <!-- Shared authentication header. -->
      <!--Shared Header-->
      <header class="TAMS-header">
        <span class="TAMS-header__page-name">TAMS</span>
      </header>

      <!-- Session Expired page main content -->
      <main class="TAMS-main TAMS-main--auth" id="main-content">
        <section
          class="TAMS-card session-expired__panel"
          aria-labelledby="session-expired-title"
        >
          <!-- Session Expired page heading-->
          <div class="TAMS-page-heading session-expired__heading">
            <h1 class="TAMS-page-heading__title" id="session-expired-title">
              Session Expired
            </h1>
            <p class="TAMS-page-heading__description">
              Your sign-in session has ended.
            </p>
          </div>
          <!-- Session Expiration message -->
          <div
            class="TAMS-alert TAMS-alert--warning session-expired__notice"
            role="status"
          >
            <p>
              Your session has expired. Sign in again to continue using TAMS.
            </p>
          </div>
          <!-- Login page link -->
          <div class="session-expired__actions">
            <a class="TAMS-button TAMS-button--primary" href="login.html"
              >Sign In Again</a
            >
          </div>
        </section>
      </main>

      <footer class="TAMS-footer TAMS-footer--auth">
        <small>TAMS | Time Approval Management System</small>
      </footer>
    </div>
  </body>
</html>
