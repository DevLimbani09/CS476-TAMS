<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="TAMS, Time Approval Management System." name="description" />
    <title>Forgot Password | TAMS</title>
    <link href="../static/css/forgot_password/styles.css" rel="stylesheet" />
    <script defer src="../static/css/js/event_handlers.js"></script>
    <script defer src="../static/css/js/event_registration.js"></script>
  </head>

  <body class="TAMS-app page-forgot-password" data-page="forgot_password">
    <div class="TAMS-layout TAMS-layout--auth">
      <!-- Shared authentication header. Keep this consistent across all six pages. -->
      <!--Shared Header-->
      <header class="TAMS-header">
        <span class="TAMS-header__page-name">TAMS</span>
      </header>
      <main class="TAMS-main TAMS-main--auth" id="main-content">
        <section
          aria-labelledby="forgot-password-title"
          class="TAMS-card forgot-password__panel"
        >
          <div class="TAMS-page-heading forgot-password__heading">
            <h1 class="TAMS-page-heading__title" id="forgot-password-title">
              Forgot Password
            </h1>
            <p class="TAMS-page-heading__description">
              Request a secure password reset link for your account.
            </p>
          </div>
          <form action="" class="TAMS-form forgot-password__form" method="post">
            <div class="TAMS-form__field forgot-password__email-field">
              <label class="TAMS-form__label" for="forgot-password-email"
                >Corporate Email Address</label
              >
              <input
                class="TAMS-form__input"
                id="forgot-password-email"
                maxlength="254"
                name="email"
                placeholder="Enter email address"
                required=""
                type="email"
              />
            </div>
            <div class="TAMS-form__actions forgot-password__actions">
              <button class="TAMS-button TAMS-button--primary" type="submit">
                Send Reset Link
              </button>
            </div>
          </form>
          <div
            class="TAMS-alert TAMS-alert--success forgot-password__confirmation"
            hidden=""
            id="forgot-password-confirmation"
            role="status"
          >
            If the address is registered, you will receive instructions to reset
            your password.
          </div>
          <p class="forgot-password__back-link">
            <a href="login.html">Back to Login</a>
          </p>
        </section>
      </main>
      <footer class="TAMS-footer TAMS-footer--auth">
        <small>TAMS | Time Approval Management System</small>
      </footer>
    </div>
  </body>
</html>
