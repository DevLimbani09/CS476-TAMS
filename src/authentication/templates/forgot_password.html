<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TAMS, Time Approval Management System.">
    <title>Forgot Password | TAMS</title>
<!-- Reference to the styles.css -->
<!-- Styles.css consists of the entire formating information -->
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body class="TAMS-app page-forgot-password" data-page="forgot_password">

    <div class="TAMS-layout TAMS-layout--auth">
        <!-- Shared authentication header. -->
        <header class="TAMS-header TAMS-header--auth">
            <a class="TAMS-header__brand" href="login.html" aria-label="TAMS login">TAMS</a>
            <span class="TAMS-header__app-name">Time Approval Management System</span>
        </header>
        <!-- Forgot Password Page main content -->
        <main class="TAMS-main TAMS-main--auth" id="main-content">
            <!-- Forgot Password Page specific header -->
            <section class="TAMS-card forgot-password__panel" aria-labelledby="forgot-password-title">
                <div class="TAMS-page-heading forgot-password__heading">
                    <h1 class="TAMS-page-heading__title" id="forgot-password-title">Forgot Password</h1>
                    <p class="TAMS-page-heading__description">Request a secure password reset link for your account.</p>
                </div>
                <!-- Forgot Password form: Email Address -->
                <form class="TAMS-form forgot-password__form" method="post" action="">
                    <!-- Email Field -->
                    <div class="TAMS-form__field forgot-password__email-field">
                        <label class="TAMS-form__label" for="forgot-password-email">Corporate Email Address</label>
                        <input class="TAMS-form__input" id="forgot-password-email" name="email" type="email" placeholder="Enter email address" required maxlength="254">
                    </div>
                    <!-- Send Reset Link button -->
                    <div class="TAMS-form__actions forgot-password__actions">
                        <button class="TAMS-button TAMS-button--primary" type="submit">Send Reset Link</button>
                    </div>
                </form>
                <!-- Login page link-->
                <div class="TAMS-alert TAMS-alert--success forgot-password__confirmation" id="forgot-password-confirmation" role="status" hidden>If the address is registered, you will receive instructions to reset your password.</div>
                <p class="forgot-password__back-link"><a href="login.html">Back to Login</a></p>
            </section>
        </main>

        <footer class="TAMS-footer TAMS-footer--auth">
            <small>TAMS | Time Approval Management System</small>
        </footer>
    </div>
</body>
</html>
