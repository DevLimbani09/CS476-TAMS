<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TAMS, Time Approval Management System.">
    <title>Change Password | TAMS</title>

    <link rel="stylesheet" href="../static/css/styles.css">

</head>
<body class="TAMS-app page-change-password" data-page="change_password">

    <div class="TAMS-layout TAMS-layout--auth">
        <!-- Shared authentication header. -->
        <header class="TAMS-header TAMS-header--auth">
            <a class="TAMS-header__brand" href="login.html" aria-label="TAMS login">TAMS</a>
            <span class="TAMS-header__app-name">Time Approval Management System</span>
        </header>
        <!-- Change password Page main content -->
        <main class="TAMS-main TAMS-main--auth" id="main-content">

            <section class="TAMS-card change-password__panel" aria-labelledby="change-password-title">
                <!-- Change Password Page specific heading  -->
                <div class="TAMS-page-heading change-password__heading">
                    <h1 class="TAMS-page-heading__title" id="change-password-title">Change Password</h1>
                    <p class="TAMS-page-heading__description">Update the password for your sign-in account.</p>
                </div>
                
                <!-- Change Password Page form: Current Password, New Password, Confirm New password -->
                <form class="TAMS-form change-password__form" method="post" action="">
                    <!-- Current Password Field -->
                    <div class="TAMS-form__field change-password__current-field">
                        <label class="TAMS-form__label" for="change-password-current">Current Password</label>
                        <input class="TAMS-form__input" id="change-password-current" name="current_password" type="password" placeholder="Enter current-password" required>
                    </div>
                    <!-- New Password Field -->
                    <div class="TAMS-form__field change-password__new-field">
                        <label class="TAMS-form__label" for="change-password-new">New Password</label>
                        <input class="TAMS-form__input" id="change-password-new" name="new_password" type="password" placeholder="Enter new-password" aria-describedby="change-password-requirements" required>
                    </div>
                    <!-- Confirm New Password Field -->
                    <div class="TAMS-form__field change-password__confirm-field">
                        <label class="TAMS-form__label" for="change-password-confirm">Confirm New Password</label>
                        <input class="TAMS-form__input" id="change-password-confirm" name="confirm_password" type="password" placeholder="Confirm new-password" required>
                    </div>
                    <!-- Password Requirements -->
                    <p class="TAMS-form__hint change-password__requirements" id="change-password-requirements">Your new password must meet the account password requirements.</p>
                    
                    <!-- Change Password Page errors hidden till password change fails -->
                    <div class="TAMS-alert TAMS-alert--error change-password__error" id="change-password-error" role="alert" hidden>Unable to change password. Check the entered passwords and try again.</div>
                    <!-- Save New password button -->
                    <div class="TAMS-form__actions change-password__actions">
                        <button class="TAMS-button TAMS-button--primary" type="submit">Save New Password</button>
                        <a class="TAMS-button TAMS-button--secondary" href="../shared/settings.html">Cancel</a>
                    </div>
                </form>
            </section>
        </main>

        <footer class="TAMS-footer TAMS-footer--auth">
            <small>TAMS | Time Approval Management System</small>
        </footer>
    </div>
</body>
</html>
