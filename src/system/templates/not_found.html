<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TAMS, Time Approval Management System.">
    <title>404 Page Not Found | TAMS</title>
    <link rel="stylesheet" href="../static/system/not_found/styles.css">
    <!-- Django later: wire the 404 error handler; do not expose private exception details. -->
</head>
<body class="TAMS-app page-not-found" data-page="not_found">
    <!-- Public-friendly page: do not assume the visitor is authenticated. -->
    <div class="TAMS-layout TAMS-layout--system">
        <header class="TAMS-header TAMS-header--system">
            <a class="TAMS-header__brand" href="../authentication/login.html">TAMS</a>
            <span class="TAMS-header__app-name">Time Approval Management System</span>
        </header>
        <main class="TAMS-main TAMS-main--system" id="main-content">
            <section class="TAMS-card not-found__panel" aria-labelledby="not-found-title">
                <p class="not-found__status-code">404</p>
                <h1 id="not-found-title">Page Not Found</h1>
                <p class="not-found__message">We could not find the requested page.</p>
                <p class="not-found__description">The page may have moved, or the requested record may no longer be available.</p>
                <div class="not-found__actions">
                    <a class="TAMS-button TAMS-button--primary" href="../shared/dashboard.html">Go to Dashboard</a>
                    <a class="TAMS-button TAMS-button--secondary" href="../authentication/login.html">Go to Login</a>
                </div>
            </section>
        </main>
        <footer class="TAMS-footer TAMS-footer--system"><small>TAMS | Time Approval Management System</small></footer>
    </div>
</body>
</html>
