<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TAMS, Time Approval Management System.">
    <title>403 Access Denied | TAMS</title>
    <link rel="stylesheet" href="../static/system/access_denied/styles.css">
    <!-- Django later: wire the 403 error handler; do not expose private exception details. -->
</head>
<body class="TAMS-app page-access-denied" data-page="access_denied">
    <!-- Public-friendly page: do not assume the visitor is authenticated. -->
    <div class="TAMS-layout TAMS-layout--system">
        <header class="TAMS-header TAMS-header--system">
            <a class="TAMS-header__brand" href="../authentication/login.html">TAMS</a>
            <span class="TAMS-header__app-name">Time Approval Management System</span>
        </header>
        <main class="TAMS-main TAMS-main--system" id="main-content">
            <section class="TAMS-card access-denied__panel" aria-labelledby="access-denied-title">
                <p class="access-denied__status-code">403</p>
                <h1 id="access-denied-title">Access Denied</h1>
                <p class="access-denied__message">You do not have permission to access this page.</p>
                <p class="access-denied__description">Your account may not have access to the requested action or resource.</p>
                <div class="access-denied__actions">
                    <a class="TAMS-button TAMS-button--primary" href="../shared/dashboard.html">Go to Dashboard</a>
                    <a class="TAMS-button TAMS-button--secondary" href="../authentication/login.html">Go to Login</a>
                </div>
            </section>
        </main>
        <footer class="TAMS-footer TAMS-footer--system"><small>TAMS | Time Approval Management System</small></footer>
    </div>
</body>
</html>
